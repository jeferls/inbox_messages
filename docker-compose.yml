version: "3.9"

services:
  inbox_messages:
    container_name: svc-inbox_messages
    build: .
    image: inbox:latest
    environment:
      - NODE_ENV=production
      - PORT=80
      # Persistência do SQLite fora do container
      - DB_PATH=/data/data.db
      # Ajuste conforme necessário para o front que acessará
      - ALLOWED_ORIGIN=*
      # IP da máquina na LAN, usado como sugestão na página de QR Code
      - LAN_HOST=${LAN_HOST:-}
      # Mock da WhatsApp Cloud API (aba WhatsApp): backend que recebe os webhooks (mensagens do cliente e status)
      - WA_MOCK_WEBHOOK_URL=${WA_MOCK_WEBHOOK_URL:-http://messages-nginx/api/whatsapp/callback}
    ports:
      - "8115:80"
    volumes:
      - inbox_data:/data
      # Permite subir/parar os containers do ambiente local pela página de QR Code
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - greenn-network

  claim_page:
    container_name: svc-claim-page
    build: ./claim-page
    image: claim-page:latest
    environment:
      - NODE_ENV=production
      - PORT=80
      # Hostname do greenn-back dentro da rede greenn-network (container-to-container)
      - GREENN_BACK_URL=http://greenn-back-nginx
    ports:
      - "6002:80"
    networks:
      - greenn-network

volumes:
  inbox_data:
    driver: local

networks:
  greenn-network:
    external: true
