<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Greenn-Tools</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .switch { position: relative; display: inline-block; width: 52px; height: 28px; flex-shrink: 0; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .switch .slider { position: absolute; inset: 0; background: #d1d5db; border-radius: 999px; cursor: pointer; transition: background 0.15s ease; }
      .switch .slider::before { content: ''; position: absolute; height: 22px; width: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.15s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
      .switch input:checked + .slider { background: #16a34a; }
      .switch input:checked + .slider::before { transform: translateX(24px); }
      .switch input:disabled + .slider { opacity: 0.55; cursor: progress; }
      .switch input:focus-visible + .slider { outline: 2px solid #2563eb; outline-offset: 2px; }

      .flag-error { color: #b91c1c; font-size: 13px; margin-top: 8px; }
      .badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; border: 1px solid transparent; }
      .badge.st-pending { background: #fffbeb; color: #92400e; border-color: #fde68a; }

      .flag-warning { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-top: 8px; }

      .flag-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #e5e7eb; }
      .flag-row .mono { flex: 1; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      .user-row { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid #e5e7eb; font-size: 13px; }
      .user-row span:first-child { flex: 1; }
      .modal-card.small { width: min(100%, 640px); }
      .modal-header h2 { margin: 0 6px; font-size: 15px; }
      .modal-form { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; }
      .modal-form input { flex: 1; }
      .modal-list { overflow: auto; }
      .modal-note { padding: 8px 14px; font-size: 13px; color: #374151; }
      .modal-note:empty { display: none; }
      #backPath { width: 420px; max-width: 100%; }
      .page-header, .page-actions { flex-wrap: wrap; gap: 8px; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <nav class="sidebar">
        <div class="sidebar-brand">Greenn Tools</div>
        <div class="sidebar-nav">
          <a class="sidebar-link" href="/">Inbox</a>
          <a class="sidebar-link" href="/email-templates.html">E-mails</a>
          <a class="sidebar-link" href="/lotes.html">Lotes SLC</a>
          <a class="sidebar-link" href="/receivables.html">TAG URs</a>
          <a class="sidebar-link" href="/equals-mocks.html">Equals Mocks</a>
          <span class="sidebar-link disabled" title="Aba desabilitada">Gateway Mocks</span>
          <a class="sidebar-link" href="/claims.html">Reclamações</a>
          <a class="sidebar-link" href="/postback-gateway.html">Postback Gateway</a>
          <span class="sidebar-link disabled" title="Aba desabilitada">Testes de Pagamento</span>
          <a class="sidebar-link" href="/konduto.html">Konduto</a>
          <a class="sidebar-link" href="/recorrencia.html">Recorrência</a>
          <a class="sidebar-link" href="/qrcode.html">Greenn-Mobile</a>
          <a class="sidebar-link" href="/whatsapp.html">WhatsApp</a>
          <a class="sidebar-link" href="/whs-forward.html">Webhook Forward</a>
          <a class="sidebar-link active" href="/flags.html">Flags</a>
        </div>
      </nav>
      <div class="app-content">
        <div class="page-shell">
          <div class="page-header">
            <h1>Flags do greenn-back</h1>
            <div class="page-actions">
              <input id="backPath" type="text" placeholder="/caminho/para/greenn-local/greenn-back" autocomplete="off" />
              <button id="loadBtn" type="button">Carregar</button>
              <button id="byUserBtn" type="button" disabled>Por usuário</button>
            </div>
          </div>

          <div class="status-line" id="statusLine"></div>
          <div class="flag-error" id="flagError" hidden></div>
          <div class="flag-warning" id="flagWarning" hidden></div>

          <section class="panel">
            <div class="panel-header"><input id="flagFilter" type="search" placeholder="Filtrar flags..." /></div>
            <div id="flagList"><div class="empty">Informe o caminho do greenn-back e clique em Carregar</div></div>
          </section>
        </div>
      </div>
    </div>

    <!-- Usuários de uma flag -->
    <div id="flagUsersModal" class="modal" hidden>
      <div class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="flagUsersTitle">
        <div class="modal-header">
          <h2 id="flagUsersTitle"></h2>
          <div class="spacer"></div>
          <button type="button" data-close>Fechar</button>
        </div>
        <form id="flagUsersForm" class="modal-form">
          <input name="user" type="text" placeholder="ID ou e-mail do usuário" autocomplete="off" required />
          <button type="submit">Adicionar usuário</button>
        </form>
        <div class="modal-note" id="flagUsersNote"></div>
        <div class="modal-list" id="flagUsersList"></div>
      </div>
    </div>

    <!-- Flags de um usuário -->
    <div id="userModal" class="modal" hidden>
      <div class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
        <div class="modal-header">
          <h2 id="userModalTitle">Flags por usuário</h2>
          <div class="spacer"></div>
          <button type="button" class="danger" id="userRemoveAll" hidden>Remover todas</button>
          <button type="button" data-close>Fechar</button>
        </div>
        <form id="userSearchForm" class="modal-form">
          <input name="user" type="text" placeholder="ID ou e-mail do usuário" autocomplete="off" required />
          <button type="submit">Buscar</button>
        </form>
        <form id="userAddForm" class="modal-form" hidden>
          <input name="flag" type="text" list="flagOptions" placeholder="Flag para adicionar" autocomplete="off" required />
          <button type="submit">Adicionar flag</button>
        </form>
        <datalist id="flagOptions"></datalist>
        <div class="modal-note" id="userNote"></div>
        <div class="modal-list" id="userFlagList"></div>
      </div>
    </div>

    <script src="/flags.js?v=2"></script>
    <script src="/tab-badge.js?v=1"></script>
  </body>
</html>
